services:
  hipages-scraper:
    environment:
      - RUN_ON_STARTUP=true  # Run scrape on container start for testing
      - HIPAGES_HEADLESS=true  # Container has no X server, must stay headless
    volumes:
      - ./services/hipages-scraper/src:/app/src:ro      # Mount source for hot-reload during dev
      - ./services/hipages-scraper/tests:/app/tests:ro  # Mount tests for running inside container
