# Revive Property Co - V-Rogue Deployment
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revivepropertyco
    restart: unless-stopped
    env_file: .env
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.revivepropertyco-www.rule=Host(`www.revivepropertyco.au`)"
      - "traefik.http.routers.revivepropertyco-www.entrypoints=websecure"
      - "traefik.http.routers.revivepropertyco-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.revivepropertyco-www.middlewares=www-to-apex"
      - "traefik.http.routers.revivepropertyco.rule=Host(`revivepropertyco.au`)"
      - "traefik.http.routers.revivepropertyco.entrypoints=websecure"
      - "traefik.http.routers.revivepropertyco.tls.certresolver=letsencrypt"
      - "traefik.http.routers.revivepropertyco.priority=50"
      - "traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\\.revivepropertyco\\.au/(.*)"
      - "traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://revivepropertyco.au/$${1}"
      - "traefik.http.middlewares.www-to-apex.redirectregex.permanent=true"
      - "traefik.http.services.revivepropertyco.loadbalancer.server.port=80"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: revivepropertyco-backend
    restart: unless-stopped
    env_file: .env
    networks:
      - traefik-public
      - internal
    volumes:
      - customer-uploads:/app/uploads/customers
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.revivepropertyco-api.rule=Host(`revivepropertyco.au`) && PathPrefix(`/api`)"
      - "traefik.http.routers.revivepropertyco-api.entrypoints=websecure"
      - "traefik.http.routers.revivepropertyco-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.revivepropertyco-api.priority=100"
      - "traefik.http.routers.revivepropertyco-socketio.rule=Host(`revivepropertyco.au`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.revivepropertyco-socketio.entrypoints=websecure"
      - "traefik.http.routers.revivepropertyco-socketio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.revivepropertyco-socketio.middlewares=websocket-headers"
      - "traefik.http.routers.revivepropertyco-socketio.priority=100"
      - "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.Upgrade=websocket"
      - "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.Connection=Upgrade"
      - "traefik.http.services.revivepropertyco-api.loadbalancer.server.port=8080"

  hipages-scraper:
    build:
      context: ./services/hipages-scraper
      dockerfile: Dockerfile
    container_name: revive-hipages-scraper
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
    volumes:
      - hipages-output:/app/output
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  hp-business-scraper:
    build:
      context: ./services/hp-business-scraper
      dockerfile: Dockerfile
    container_name: revive-hp-business-scraper
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
    volumes:
      - hp-business-output:/app/output
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  twenty-db:
    image: postgres:15-alpine
    container_name: twenty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD_FILE: /run/secrets/twenty_db_pass
      POSTGRES_DB: twenty_crms
    secrets:
      - twenty_db_pass
    volumes:
      - twenty-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "twenty"]
      interval: 10s
      timeout: 5s
      retries: 5

  twenty-redis:
    image: redis:7-alpine
    container_name: twenty-redis
    restart: unless-stopped
    volumes:
      - twenty-redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  twenty-server:
    image: twentycrm/twenty:v1.22.6
    container_name: twenty-server
    restart: unless-stopped
    env_file: .env.twenty
    depends_on:
      - twenty-db
      - twenty-redis
    secrets:
      - twenty_db_pass
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.twenty.rule=Host(`crm.revivepropertyco.au`)"
      - "traefik.http.routers.twenty.entrypoints=websecure"
      - "traefik.http.routers.twenty.tls.certresolver=letsencrypt"
      - "traefik.http.services.twenty.loadbalancer.server.port=3000"

secrets:
  twenty_db_pass:
    file: ./secrets/twenty_db_password

volumes:
  customer-uploads:
  hipages-output:
  hp-business-output:
  twenty-data:
  twenty-redis:

networks:
  traefik-public:
    external: true
  internal:
    external: true
